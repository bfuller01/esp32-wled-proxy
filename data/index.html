<script>
    function validateIP(ip) {
        const regex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|\*)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|\*)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|\*)$/;
        return regex.test(ip);
    }

    function sendPayload(targetIp, power, brightness, color, pattern, speed, intensity) {
        if (!validateIP(targetIp)) {
            updateStatusMessage('Invalid IP address', 'error');
            return;
        }

        const payload = JSON.stringify({ power, brightness, color, pattern, speed, intensity });

        fetch(`http://${targetIp}/api/control`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: payload
        })
        .then(response => {
            if (response.ok) {
                updateStatusMessage('Success', 'success');
            } else {
                updateStatusMessage('Error: ' + response.statusText, 'error');
            }
        })
        .catch(error => { updateStatusMessage('Error: ' + error.message, 'error'); });
    }

    function updateStatusMessage(message, status) {
        const statusMessageElement = document.getElementById('status-message');
        statusMessageElement.textContent = message;
        statusMessageElement.className = status; // 'success' or 'error'
    }
</script>
